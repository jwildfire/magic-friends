name: Release

# Publishes a GitHub release with the playable single-file game attached. Run it from the Actions tab
# with a version such as v1.1 (it creates the tag on the current main), or push a tag such as v1.1.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html matches src/
        run: |
          ./build.sh
          git diff --exit-code index.html
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp index.html magic-friends.html
          gh release create "$TAG" magic-friends.html \
            --target "$GITHUB_SHA" \
            --title "Magic Friends, Up We Go! $TAG" \
            --notes-file RELEASE_NOTES.md
