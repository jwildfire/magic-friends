name: Release

# Pushing a tag such as v1.0 publishes a GitHub release with the playable single-file game attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html matches src/
        run: |
          ./build.sh
          git diff --exit-code index.html
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp index.html magic-friends.html
          gh release create "$GITHUB_REF_NAME" magic-friends.html \
            --title "Magic Friends, Up We Go! $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
